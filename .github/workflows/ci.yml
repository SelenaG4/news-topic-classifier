name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # Includes torch + transformers even though no fine-tuned weights
        # are checked into this repo (see README/models/.gitkeep) -- the
        # test suite itself trains and evaluates the real classical
        # baseline, and the API tests assert the fresh-checkout
        # transformer_loaded: false / graceful-degradation path actually
        # works, both of which this install makes possible end to end.
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v
